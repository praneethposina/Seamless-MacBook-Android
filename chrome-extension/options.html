<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Seamless settings</title>
  <style>
    body { font: 14px -apple-system, system-ui, sans-serif; max-width: 520px; margin: 32px auto; padding: 0 16px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input[type=text], input[type=number] { width: 100%; padding: 8px; box-sizing: border-box; }
    code { background: #f2f2f2; padding: 2px 4px; border-radius: 4px; }
    button { margin-top: 18px; padding: 8px 16px; }
    #status { margin-left: 10px; }
  </style>
</head>
<body>
  <h1>Seamless: Send to Phone</h1>
  <p>Run <code>python3 seamless_agent.py token</code> on your Mac and paste the token here.</p>
  <label for="token">Agent token</label>
  <input id="token" type="text" autocomplete="off">
  <label for="port">Agent port</label>
  <input id="port" type="number" min="1" max="65535">
  <label><input id="pause" type="checkbox"> Pause the video on the Mac after sending it to the phone</label>
  <button id="save">Save &amp; test</button><span id="status"></span>
  <p>Shortcuts: <b>⌘⇧Y</b> send tab · <b>⌘⇧U</b> push Mac clipboard. Change them at <code>chrome://extensions/shortcuts</code>.</p>
  <script src="options.js" type="module"></script>
</body>
</html>
